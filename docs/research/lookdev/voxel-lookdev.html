<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","postprocessing":"./node_modules/postprocessing/build/index.js","n8ao":"./node_modules/n8ao/dist/N8AO.js","three/examples/jsm/":"./node_modules/three/examples/jsm/","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// Look-dev prototype: greedy meshing + per-vertex AO + shader per-voxel jitter/edge shading,
// world voxels (VS) vs character voxels (1/32 m).
import * as THREE from 'three';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, ToneMappingEffect, ToneMappingMode, SMAAEffect, VignetteEffect } from 'postprocessing';
import { N8AOPostPass } from 'n8ao';
const params = new URLSearchParams(location.search);
const VS = parseFloat(params.get('vs') || '0.25');
const EDGES = params.get('edges') !== '0';

// ---------------------------------------------------------------- greedy mesher
const AO_CURVE = [0.5, 0.68, 0.84, 1.0];
function greedy(vol, X, Y, Z, scale, palette) {
  const solid = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < X && y < Y && z < Z && vol[x + X * (y + Y * z)] !== 0;
  const get = (x, y, z) => vol[x + X * (y + Y * z)];
  const dims = [X, Y, Z];
  const pos = [], nor = [], col = [], idx = [];
  const p = [0, 0, 0];
  for (let d = 0; d < 3; d++) {
    const u = (d + 1) % 3, v = (d + 2) % 3;
    const W = dims[u], H = dims[v];
    const keys = new Int32Array(W * H), aos = new Int32Array(W * H);
    for (const side of [-1, 1]) {
      for (let s = 0; s < dims[d]; s++) {
        keys.fill(0);
        for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
          p[d] = s; p[u] = i; p[v] = j;
          if (!solid(p[0], p[1], p[2])) continue;
          const q = [p[0], p[1], p[2]]; q[d] += side;
          if (solid(q[0], q[1], q[2])) continue;
          // AO from the air layer
          const o = (du, dv) => { const r = [q[0], q[1], q[2]]; r[u] += du; r[v] += dv; return solid(r[0], r[1], r[2]) ? 1 : 0; };
          const corner = (du, dv) => { const s1 = o(du, 0), s2 = o(0, dv), c = o(du, dv); return (s1 && s2) ? 0 : 3 - (s1 + s2 + c); };
          const a = corner(-1, -1) | (corner(1, -1) << 2) | (corner(1, 1) << 4) | (corner(-1, 1) << 6);
          keys[i + j * W] = get(p[0], p[1], p[2]); aos[i + j * W] = a;
        }
        // merge
        for (let j = 0; j < H; j++) for (let i = 0; i < W;) {
          const k = keys[i + j * W]; if (!k) { i++; continue; }
          const a = aos[i + j * W];
          let w = 1; while (i + w < W && keys[i + w + j * W] === k && aos[i + w + j * W] === a) w++;
          let h = 1; outer: while (j + h < H) { for (let t = 0; t < w; t++) if (keys[i + t + (j + h) * W] !== k || aos[i + t + (j + h) * W] !== a) break outer; h++; }
          for (let jj = 0; jj < h; jj++) for (let t = 0; t < w; t++) keys[i + t + (j + jj) * W] = 0;
          // emit quad
          const base = pos.length / 3;
          const plane = s + (side > 0 ? 1 : 0);
          const corners = [[i, j], [i + w, j], [i + w, j + h], [i, j + h]];
          const aoc = [a & 3, (a >> 2) & 3, (a >> 4) & 3, (a >> 6) & 3];
          const c = palette[k];
          for (let n = 0; n < 4; n++) {
            const r = [0, 0, 0]; r[d] = plane; r[u] = corners[n][0]; r[v] = corners[n][1];
            pos.push(r[0] * scale, r[1] * scale, r[2] * scale);
            const nn = [0, 0, 0]; nn[d] = side; nor.push(nn[0], nn[1], nn[2]);
            const f = AO_CURVE[aoc[n]]; col.push(c[0] * f, c[1] * f, c[2] * f);
          }
          const flip = aoc[0] + aoc[2] < aoc[1] + aoc[3];
          const tri = flip ? [0, 1, 3, 1, 2, 3] : [0, 1, 2, 0, 2, 3];
          const t2 = side > 0 ? tri : [tri[0], tri[2], tri[1], tri[3], tri[5], tri[4]];
          for (const t of t2) idx.push(base + t);
          i += w;
        }
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
}

// ---------------------------------------------------------------- voxel material with per-voxel jitter + edge shading
function voxelMaterial(voxelSize) {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uVS = { value: voxelSize };
    sh.uniforms.uEdges = { value: EDGES ? 1 : 0 };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWPos; varying vec3 vWNor;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed,1.0)).xyz; vWNor = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vWPos; varying vec3 vWNor; uniform float uVS; uniform float uEdges;
      float h13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
      {
        vec3 p = vWPos / uVS;
        vec3 n = normalize(vWNor);
        vec3 cell = floor(p - n * 0.5);
        float j = h13(cell) - 0.5;
        float lf = h13(floor(p/7.0)) - 0.5; diffuseColor.rgb *= (1.0 + j * 0.14) * (1.0 + lf * 0.08);
        vec3 f = fract(p);
        vec3 an = abs(n);
        vec2 t = an.x > 0.5 ? f.yz : (an.y > 0.5 ? f.xz : f.xy);
        vec2 e = min(t, 1.0 - t);
        float edge = min(e.x, e.y);
        diffuseColor.rgb *= mix(1.0, 0.94 + 0.06 * smoothstep(0.0, 0.08, edge), uEdges);
      }`);
  };
  return m;
}

// ---------------------------------------------------------------- scene
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1280, 720); r.setPixelRatio(1);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc4ee); scene.fog = new THREE.Fog(0x9cc4ee, 25, 70);
const cam = new THREE.PerspectiveCamera(42, 1280 / 720, 0.05, 200);
cam.position.set(7.5, 4.2, 9.5); cam.lookAt(0, 1.6, 0);
scene.add(new THREE.HemisphereLight(0xd6e8ff, 0x5a4a3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.8); sun.position.set(12, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02; scene.add(sun);

// world palette (sRGB → linear)
const lin = (hex) => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const PAL = [null, lin(0x6b4f36), lin(0x5f8f3a), lin(0xe9e4d8), lin(0x7a5232), lin(0x3d4656), lin(0x2a3442), lin(0x9a9a92), lin(0x5b5b55)];
// 1 dirt, 2 grass, 3 plaster, 4 wood, 5 roof tile, 6 window, 7 stone, 8 dark stone
const M = (m) => Math.round(m / VS);
const X = M(24), Y = M(14), Z = M(24);
const vol = new Uint8Array(X * Y * Z);
const set = (x, y, z, v) => { if (x >= 0 && y >= 0 && z >= 0 && x < X && y < Y && z < Z) vol[x + X * (y + Y * z)] = v; };
const getv = (x, y, z) => vol[x + X * (y + Y * z)];
// ground
for (let x = 0; x < X; x++) for (let z = 0; z < Z; z++) { const gh = M(3.0); for (let y = 0; y < gh; y++) set(x, y, z, y === gh - 1 ? 2 : (y < gh - M(1.0) ? 8 : 1)); }
// crater
const cx = M(15), cz = M(15), cr = M(2.2);
for (let x = 0; x < X; x++) for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) { const dx = x - cx, dy = y - M(3.2), dz = z - cz; if (dx * dx + dy * dy * 2 + dz * dz < cr * cr) set(x, y, z, 0); }
// house: footprint 6x5 m, two floors 3 m each
const hx0 = M(3), hz0 = M(4), hx1 = M(9), hz1 = M(9), hy0 = M(3.0), hy1 = M(9.0);
for (let x = hx0; x < hx1; x++) for (let z = hz0; z < hz1; z++) for (let y = hy0; y < hy1; y++) {
  const wall = x === hx0 || x === hx1 - 1 || z === hz0 || z === hz1 - 1;
  const floor = (y - hy0) % M(3) === 0;
  if (!wall && !floor) continue;
  const post = (x === hx0 || x === hx1 - 1) && (z === hz0 || z === hz1 - 1);
  let m = post ? 4 : 3;
  if (wall && !post && (y - hy0) % M(3) === M(3) - 1) m = 4; // beam
  // windows
  const ly = (y - hy0) % M(3);
  const along = (z === hz0 || z === hz1 - 1) ? x - hx0 : z - hz0;
  if (wall && !post && ly >= M(1.0) && ly < M(2.0) && (along % M(2)) >= M(0.5) && (along % M(2)) < M(1.5)) m = 6;
  set(x, y, z, m);
}
// roof (hip-ish)
for (let k = 0; k < M(2.2); k++) for (let x = hx0 - M(0.75) + k; x < hx1 + M(0.75) - k; x++) for (let z = hz0 - M(0.75) + k; z < hz1 + M(0.75) - k; z++) set(x, hy1 + k, z, 5);
// stone wall
for (let x = M(10.5); x < M(20); x++) for (let y = M(3.0); y < M(4.6); y++) for (let z = M(6.0); z < M(6.5); z++) { const row = Math.floor(y / 2); const mortar = (y % 2 === 1) || ((x + (row % 2) * 2) % 4 === 0); set(x, y, z, mortar ? 8 : 7); }
// sliced gap through the wall (a "Getsuga" cut)
for (let x = 0; x < X; x++) for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) { const px = x * VS - 14.5, py = y * VS - 3.0; if (Math.abs(px + (py - 0.9) * 0.9) < VS * 0.75 && z >= M(6.0) && z < M(6.5) && py > 0) set(x, y, z, 0); }

const wg = greedy(vol, X, Y, Z, VS, PAL);
const wm = new THREE.Mesh(wg, voxelMaterial(VS)); wm.position.set(-12, -3, -12); wm.castShadow = wm.receiveShadow = true; scene.add(wm);

// ---------------------------------------------------------------- character at 32 voxels / m (quick primitive build, look test only)
const CV = 1 / 32;
const CX = 40, CY = 64, CZ = 28;
const cvol = new Uint8Array(CX * CY * CZ);
const cs = (x, y, z, v) => { if (x >= 0 && y >= 0 && z >= 0 && x < CX && y < CY && z < CZ) cvol[x + CX * (y + CY * z)] = v; };
const box = (x0, y0, z0, x1, y1, z1, v) => { for (let x = x0; x < x1; x++) for (let y = y0; y < y1; y++) for (let z = z0; z < z1; z++) cs(x, y, z, v); };
const ell = (cx_, cy_, cz_, rx, ry, rz, v) => { for (let x = Math.floor(cx_ - rx); x <= cx_ + rx; x++) for (let y = Math.floor(cy_ - ry); y <= cy_ + ry; y++) for (let z = Math.floor(cz_ - rz); z <= cz_ + rz; z++) { const a = (x + 0.5 - cx_) / rx, b = (y + 0.5 - cy_) / ry, c = (z + 0.5 - cz_) / rz; if (a * a + b * b + c * c <= 1) cs(x, y, z, v); } };
const CP = [null, lin(0xf2c9a5), lin(0x15151a), lin(0xf3f3f0), lin(0xff7a1a), lin(0x23232b), lin(0xb8bcc4), lin(0x5b3a24), lin(0x3a2a1c)];
// 1 skin, 2 black robe, 3 white, 4 orange hair, 5 black blade, 6 silver edge, 7 brown sash, 8 sandal
const mx = 20, mz = 14;
box(mx - 7, 0, mz - 4, mx - 1, 2, mz + 5, 8); box(mx + 1, 0, mz - 4, mx + 7, 2, mz + 5, 8);       // feet
box(mx - 8, 2, mz - 5, mx + 8, 26, mz + 5, 2);                                                       // hakama
for (let y = 2; y < 12; y++) { box(mx - 9 - ((12 - y) >> 2), y, mz - 5, mx - 8, y + 1, mz + 5, 2); box(mx + 8, y, mz - 5, mx + 9 + ((12 - y) >> 2), y + 1, mz + 5, 2); } // flare
box(mx - 1, 2, mz - 6, mx + 1, 14, mz - 5, 5);                                                       // pleat shadow
box(mx - 8, 25, mz - 5, mx + 8, 27, mz + 5, 3);                                                      // obi (white)
box(mx - 8, 27, mz - 4, mx + 8, 44, mz + 4, 2);                                                      // kosode torso
for (let y = 36; y < 44; y++) { const w = (y - 36) >> 1; box(mx - w - 1, y, mz - 5, mx + w + 1, y + 1, mz - 4, 3); } // white V collar
box(mx - 13, 30, mz - 4, mx - 8, 44, mz + 4, 2); box(mx + 8, 30, mz - 4, mx + 13, 44, mz + 4, 2);   // sleeves
box(mx - 12, 26, mz - 2, mx - 9, 30, mz + 2, 1); box(mx + 9, 26, mz - 2, mx + 12, 30, mz + 2, 1);   // hands
box(mx - 2, 44, mz - 2, mx + 2, 47, mz + 2, 1);                                                      // neck
ell(mx, 52, mz, 6.5, 7, 6, 1);                                                                       // head
box(mx - 4, 51, mz - 7, mx - 1, 53, mz - 5, 2); box(mx + 1, 51, mz - 7, mx + 4, 53, mz - 5, 2);     // eyes (dark)
box(mx - 4, 54, mz - 7, mx - 1, 55, mz - 5, 4); box(mx + 1, 54, mz - 7, mx + 4, 55, mz - 5, 4);     // brows
ell(mx, 56, mz + 0.5, 7.5, 5, 7, 4);                                                                 // hair mass
for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2; for (let t = 0; t < 6; t++) ell(mx + Math.cos(a) * (6 + t * 0.7), 57 + t * 0.6, mz + Math.sin(a) * (5 + t * 0.7), 2.2 - t * 0.3, 1.6, 2.2 - t * 0.3, 4); }
box(mx - 6, 50, mz - 6, mx + 6, 52, mz - 5, 0);                                                     // clear fringe over eyes area partially
for (let k = -5; k <= 5; k += 2) for (let t = 0; t < 4; t++) cs(mx + k, 56 - t, mz - 7, 4);        // bangs
// Zangetsu on back (diagonal cleaver)
for (let t = 0; t < 48; t++) { const bx = mx - 9 + Math.floor(t * 0.4), by = 14 + t; box(bx, by, mz + 6, bx + 6, by + 1, mz + 8, t < 8 ? 7 : (t > 44 ? 5 : 5)); cs(bx + 6, by, mz + 6, 6); cs(bx + 6, by, mz + 7, 6); }
const cg = greedy(cvol, CX, CY, CZ, CV, CP);
const cm = new THREE.Mesh(cg, voxelMaterial(CV)); cm.position.set(-0.6, 0.0, 1.2); cm.rotation.y = 0.5; cm.castShadow = cm.receiveShadow = true; scene.add(cm);


r.toneMapping = THREE.NoToneMapping;
// Getsuga Tensho test crescent
const sh = new THREE.Shape(); sh.absarc(0, 0, 1.6, -1.2, 1.2, false); sh.absarc(-0.55, 0, 1.25, 1.05, -1.05, true);
const gg = new THREE.ExtrudeGeometry(sh, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2, curveSegments: 32 });
const gmat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.8, 4.0), toneMapped: false });
const gm = new THREE.Mesh(gg, gmat); gm.position.set(2.6, 1.9, -1.5); gm.rotation.set(0.1, -0.9, 0.35); scene.add(gm);
const gl2 = new THREE.PointLight(0x88aaff, 6, 8, 2); gl2.position.copy(gm.position); scene.add(gl2);
const composer = new EffectComposer(r, { frameBufferType: THREE.HalfFloatType });
composer.addPass(new RenderPass(scene, cam));
const ao = new N8AOPostPass(scene, cam, 1280, 720); ao.configuration.aoRadius = 1.2; ao.configuration.distanceFalloff = 0.6; ao.configuration.intensity = 2.5; ao.configuration.gammaCorrection = false;
composer.addPass(ao);
composer.addPass(new EffectPass(cam, new BloomEffect({ mipmapBlur: true, luminanceThreshold: 1.0, intensity: 1.6, radius: 0.7 }), new VignetteEffect({ darkness: 0.45 }), new ToneMappingEffect({ mode: ToneMappingMode.AGX }), new SMAAEffect()));
composer.render(0.016);

window.__result = { vs: VS, worldTris: wg.index.count / 3, charTris: cg.index.count / 3, worldVox: vol.reduce((a, b) => a + (b ? 1 : 0), 0) };
</script></body></html>
